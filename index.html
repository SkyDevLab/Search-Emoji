<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emoji Inspector</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

/* Floating emoji background */
.emoji-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.floating-emoji {
  position: absolute;
  opacity: 0.25;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh) rotate(0deg); }
  to { transform: translateY(-10vh) rotate(360deg); }
}

/* Container */
.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

/* Heading */
h1 {
  font-size: clamp(24px, 4vw, 36px);
}

/* Status */
#status {
  color: #94a3b8;
  margin-bottom: 20px;
}

/* Search layout */
.search-box {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

input {
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  width: 100%;
  max-width: 400px;
}

button {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  background: #22c55e;
  color: white;
  font-size: 16px;
  cursor: pointer;
  min-width: 120px;
}

button:hover {
  background: #16a34a;
}

/* Card */
.card {
  margin-top: 25px;
  padding: 20px;
  background: #1e293b;
  border-radius: 15px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.big-emoji {
  font-size: clamp(50px, 10vw, 80px);
  margin-bottom: 10px;
}

/* Mobile tweaks */
@media (max-width: 480px) {

  button {
    width: 100%;
  }

  .card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="emoji-bg"></div>

<div class="container">

<h1>🔍 Emoji Inspector</h1>
<p id="status">Loading emoji database...</p>

<div class="search-box">
  <input id="input" placeholder="Paste emoji 😊">
  <button onclick="search()">Search</button>
</div>

<div id="result"></div>

</div>

<script>
let emojiData = [];

// Load emoji dataset
async function loadData() {
  try {
    const res = await fetch("https://emojihub.yurace.pro/api/all");
    emojiData = await res.json();
    document.getElementById("status").textContent = "✅ Ready";
  } catch {
    document.getElementById("status").textContent = "❌ Failed to load data";
  }
}

loadData();

// Convert unicode array to emoji
function unicodeToEmoji(unicodeArr) {
  return unicodeArr
    .map(u => String.fromCodePoint(parseInt(u.replace("U+", ""), 16)))
    .join("");
}

// Convert emoji input to unicode
function getUnicode(str) {
  return Array.from(str)
    .map(e => "U+" + e.codePointAt(0).toString(16).toUpperCase())
    .join(" ");
}

// Search function
function search() {
  const input = document.getElementById("input").value.trim();
  const result = document.getElementById("result");

  if (!input) {
    result.innerHTML = "⚠️ Enter emoji";
    return;
  }

  const unicode = getUnicode(input);

  const found = emojiData.find(e =>
    e.unicode && e.unicode.join(" ").toUpperCase() === unicode
  );

  if (!found) {
    result.innerHTML = "❌ Emoji not found";
    return;
  }

  const emojiChar = unicodeToEmoji(found.unicode);

  result.innerHTML = `
    <div class="card">
      <div class="big-emoji">${emojiChar}</div>
      <p><b>Name:</b> ${found.name}</p>
      <p><b>Category:</b> ${found.category}</p>
      <p><b>Group:</b> ${found.group}</p>
      <p><b>Unicode:</b> ${found.unicode.join(", ")}</p>
    </div>
  `;
}

// Enter key support
document.getElementById("input").addEventListener("keypress", e => {
  if (e.key === "Enter") search();
});

/* Floating emoji background */
const emojis = ["😊","😂","😍","😎","🔥","✨","🎉","👍","💖","😃"];

function createFloatingEmoji() {
  const emoji = document.createElement("div");
  emoji.className = "floating-emoji";
  emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];

  emoji.style.left = Math.random() * 100 + "vw";
  emoji.style.fontSize = Math.random() * 20 + 20 + "px";
  emoji.style.animationDuration = Math.random() * 10 + 10 + "s";

  document.querySelector(".emoji-bg").appendChild(emoji);

  setTimeout(() => emoji.remove(), 20000);
}

setInterval(createFloatingEmoji, 600);
</script>

</body>
</html>
